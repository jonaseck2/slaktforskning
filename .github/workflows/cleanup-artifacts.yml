name: Cleanup Artifacts

on:
  schedule:
    - cron: '0 3 * * 1'  # Every Monday at 03:00 UTC
  workflow_dispatch:
    inputs:
      keep_versions:
        description: 'Number of recent versions to keep'
        default: '2'
        required: false

permissions:
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete old artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          KEEP: ${{ inputs.keep_versions || '2' }}
        run: |
          # Fetch all artifacts sorted newest-first
          artifacts=$(gh api "repos/$REPO/actions/artifacts" \
            --paginate --jq '.artifacts[] | {id: .id, name: .name}')

          # Extract unique versions from names like "Slaktforskning-1.2.3-darwin"
          versions=$(echo "$artifacts" \
            | jq -r '.name' \
            | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' \
            | sort -Vr \
            | uniq)

          keep_versions=$(echo "$versions" | head -n "$KEEP")
          echo "Keeping versions: $(echo $keep_versions | tr '\n' ' ')"

          # Delete any artifact whose version is not in the keep list
          echo "$artifacts" | jq -c '.' | while read -r artifact; do
            id=$(echo "$artifact" | jq -r '.id')
            name=$(echo "$artifact" | jq -r '.name')
            version=$(echo "$name" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' || true)

            if [ -z "$version" ] || ! echo "$keep_versions" | grep -qx "$version"; then
              echo "Deleting: $name (id=$id)"
              gh api --method DELETE "repos/$REPO/actions/artifacts/$id"
            else
              echo "Keeping:  $name"
            fi
          done
