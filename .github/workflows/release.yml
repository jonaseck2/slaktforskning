# Auto-publish a GitHub Release on every push to main, gated by version.
#
# Behaviour:
#   - Read `version` from package.json.
#   - If a release tagged `v$VERSION` already exists → skip (idempotent).
#   - Otherwise → build native bundles per platform via tauri-action and
#     attach them to a new GitHub Release at tag `v$VERSION`.
#
# Per-platform artifacts (from `tauri.conf.json` → bundle.targets):
#   - macOS:   .app + .dmg
#   - Windows: NSIS .exe installer
#   - Linux:   .AppImage
#
# Signing secrets are optional — forks without them produce unsigned builds.
# All `secrets.*` values are typed inputs from the secret store, never
# user-provided strings. `package.json` version is parsed inside the runner
# from a tracked file (no untrusted input crosses into shell).

name: Release

# Triggered AFTER the CI workflow completes successfully on main. This avoids
# running the 4-OS Tauri bundle matrix in parallel with `test` + `e2e` — if
# tests fail, we don't burn ~30 minutes of runner time on bundles.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

# Only one Release per branch at a time. If a new CI completion triggers a
# Release while an older one is still running, cancel the older one. Without
# this, every CI completion since the workflow_run trigger landed will fire
# its own Release matrix — N parallel bundle builds when the user is rapidly
# iterating fixes.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  check-version:
    # Only run if the CI workflow that triggered us actually succeeded.
    # `workflow_run` fires on every completion (success, failure, cancelled).
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
      should-release: ${{ steps.check.outputs.should-release }}
    steps:
      - uses: actions/checkout@v6
        with:
          # workflow_run runs against the default branch's SHA by default;
          # pin to the exact SHA the upstream CI run validated, so the bundle
          # reflects what the tests passed against.
          ref: ${{ github.event.workflow_run.head_sha }}

      - id: read
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Found version: $VERSION"

      - id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.read.outputs.version }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists — skipping build."
            echo "should-release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Release v$VERSION does not exist — will build."
            echo "should-release=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: check-version
    if: needs.check-version.outputs.should-release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS Apple Silicon only — every Mac sold since 2020 is ARM.
          # The pre-Tauri Electron releases (v0.204.0) also shipped arm64-only.
          # GitHub's free macos-13 (Intel) runner queue routinely exceeds
          # 2 hours, blocking the rest of the matrix; not worth it for a
          # shrinking Intel Mac user base.
          - os: macos-14          # Apple Silicon
            target: aarch64-apple-darwin
          # ubuntu-24.04 — needed for libpipewire-0.3-dev >= 1.0 to satisfy
          # the libspa 0.9.x Rust crate's expectation of `spa_video_info_raw.flags`.
          # Ubuntu 22.04 ships libpipewire 0.3.48 which is too old to compile against.
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-node@v6
        with:
          # Node 22 LTS runs the esbuild MCP bundler + the fetch-bun-binaries
          # script. The shipped MCP server itself runs under Bun (downloaded
          # via scripts/fetch-bun-binaries.mjs), not the host Node.
          node-version: 22
          cache: npm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-cargo-tauri-release-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-tauri-release-

      - name: Install Linux Tauri prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev \
            build-essential curl wget file libxdo-dev \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            libpipewire-0.3-dev libgbm-dev

      - run: npm ci

      - name: Fetch Bun binaries for all targets
        run: node scripts/fetch-bun-binaries.mjs

      - name: Build MCP server bundle (esbuild)
        run: npm run build:mcp-sidecar

      - name: Build, sign, and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # linuxdeploy + its plugins are AppImages; ubuntu-24.04 has no libfuse2,
          # so they need extract+run mode instead of FUSE-mounting themselves.
          APPIMAGE_EXTRACT_AND_RUN: 1
          # No macOS codesigning — we don't ship an Apple Developer certificate.
          # The .app + .dmg are produced unsigned; users will see Gatekeeper's
          # "unidentified developer" prompt on first launch.
          # Windows Authenticode signing (optional)
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          # Tauri auto-updater signing — signs latest.json so the in-app
          # updater can verify against the pubkey in tauri.conf.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v${{ needs.check-version.outputs.version }}
          releaseName: Släktforskning v${{ needs.check-version.outputs.version }}
          releaseBody: |
            See [CHANGELOG.md](https://github.com/jonaseck2/slaktforskning/blob/main/CHANGELOG.md) for changes.
          # Keep the release as a draft until every matrix leg has uploaded
          # its artifacts. If any leg publishes (releaseDraft: false), GitHub
          # marks the release immutable on first publish and subsequent legs
          # get "Cannot upload assets to an immutable release". Manual publish
          # from the GitHub UI when all assets are present.
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}
