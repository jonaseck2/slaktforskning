# Auto-publish a GitHub Release on every push to main, gated by version.
#
# Behaviour:
#   - Read `version` from package.json.
#   - If a release tagged `v$VERSION` already exists → skip (idempotent).
#   - Otherwise → build native bundles per platform via tauri-action and
#     attach them to a new GitHub Release at tag `v$VERSION`.
#
# Per-platform artifacts (from `tauri.conf.json` → bundle.targets):
#   - macOS:   .app + .dmg
#   - Windows: NSIS .exe installer
#   - Linux:   .AppImage
#
# Signing secrets are optional — forks without them produce unsigned builds.
# All `secrets.*` values are typed inputs from the secret store, never
# user-provided strings. `package.json` version is parsed inside the runner
# from a tracked file (no untrusted input crosses into shell).

name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
      should-release: ${{ steps.check.outputs.should-release }}
    steps:
      - uses: actions/checkout@v6

      - id: read
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Found version: $VERSION"

      - id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.read.outputs.version }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists — skipping build."
            echo "should-release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Release v$VERSION does not exist — will build."
            echo "should-release=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: check-version
    if: needs.check-version.outputs.should-release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-13          # Intel
            target: x86_64-apple-darwin
          - os: macos-14          # Apple Silicon
            target: aarch64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          # Node 22 LTS runs the esbuild MCP bundler + the fetch-bun-binaries
          # script. The shipped MCP server itself runs under Bun (downloaded
          # via scripts/fetch-bun-binaries.mjs), not the host Node.
          node-version: 22
          cache: npm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-cargo-tauri-release-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-tauri-release-

      - name: Install Linux Tauri prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev \
            build-essential curl wget file libxdo-dev \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            libpipewire-0.3-dev

      - run: npm ci

      - name: Fetch Bun binaries for all targets
        run: node scripts/fetch-bun-binaries.mjs

      - name: Build MCP server bundle (esbuild)
        run: npm run build:mcp-sidecar

      - name: Build, sign, and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS signing + notarization (optional)
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_PROVIDER_SHORT_NAME: ${{ secrets.APPLE_PROVIDER_SHORT_NAME }}
          # Windows Authenticode signing (optional)
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          # Tauri auto-updater signing — signs latest.json so the in-app
          # updater can verify against the pubkey in tauri.conf.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v${{ needs.check-version.outputs.version }}
          releaseName: Släktforskning v${{ needs.check-version.outputs.version }}
          releaseBody: |
            See [CHANGELOG.md](https://github.com/jonaseck2/slaktforskning/blob/main/CHANGELOG.md) for changes.
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }}
