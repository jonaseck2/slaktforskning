# Tauri release workflow.
#
# Triggers: pushing a v* tag (e.g. `v0.250.0-tauri.0`, `v0.250.0`).
# Outputs: signed installers per OS uploaded to the GitHub Release plus
# the auto-updater manifest (`latest.json`) the in-app updater consumes.
#
# This workflow does NOT cut a release on its own — it just packages,
# signs, and publishes when the maintainer manually pushes a release tag.
#
# ─────────────────────────────────────────────────────────────────────────
# Required GitHub Secrets (set under Settings → Secrets and variables →
# Actions → Repository secrets). Generation steps documented in
# docs/distribution/secrets-setup.md.
# ─────────────────────────────────────────────────────────────────────────
#   APPLE_SIGNING_IDENTITY   — Developer ID common name, e.g. "Developer ID Application: Jonas Ahnstedt (TEAMID12)"
#   APPLE_CERTIFICATE        — Base64-encoded .p12 of the Developer ID cert
#   APPLE_CERTIFICATE_PASSWORD — Password for the .p12
#   APPLE_ID                 — Apple ID email used for notarization
#   APPLE_PASSWORD           — App-specific password for notarytool
#   APPLE_TEAM_ID            — 10-char Team ID
#   APPLE_PROVIDER_SHORT_NAME — Provider short name (usually same as Team ID)
#
#   WINDOWS_CERTIFICATE       — Base64-encoded .pfx of the Authenticode cert
#   WINDOWS_CERTIFICATE_PASSWORD — Password for the .pfx
#
#   LINUX_GPG_PRIVATE_KEY    — ASCII-armored GPG private key (for AppImage signing)
#   LINUX_GPG_PASSPHRASE     — Passphrase for the GPG key
#   LINUX_GPG_KEY_ID         — Key ID/fingerprint
#
#   TAURI_SIGNING_PRIVATE_KEY          — Auto-updater private key (from `tauri signer generate`)
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD — Passphrase for the updater key
# ─────────────────────────────────────────────────────────────────────────
#
# Security note: every untrusted-looking input that lands inside `run:` is
# routed through `env:` (`TAG_NAME`, `MATRIX_TARGET`) and quoted with
# double-quoted shell expansions. `${{ matrix.* }}` and `${{ secrets.* }}`
# are typed inputs from the workflow definition and the secret store,
# never user content. `${{ github.ref_name }}` is the pushed tag — the
# maintainer controls what tags they push, but we still pass it via env
# rather than interpolating into shell as defence-in-depth.

name: Release (Tauri)

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write  # needed to publish the GitHub Release

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-13          # Intel
            target: x86_64-apple-darwin
          - os: macos-14          # Apple Silicon
            target: aarch64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20  # pinned to 20 — must match the pkg target node20-*
          cache: npm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-cargo-tauri-release-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-tauri-release-

      - name: Install Linux Tauri prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev \
            build-essential curl wget file libxdo-dev \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - run: npm ci

      # Build the bundled MCP sidecar binary for THIS host. The build
      # script picks the matching pkg target via SIDECAR_TARGETS so we
      # don't waste 4× build time per OS runner.
      - name: Build MCP sidecar
        env:
          SIDECAR_TARGETS: ${{ matrix.target }}
        run: npm run build:mcp-sidecar

      # tauri-action handles: cargo build → bundle → sign (macOS via env,
      # Windows via env) → notarize (macOS) → generate updater manifest →
      # upload to GitHub Release.
      - name: Build, sign, and publish
        uses: tauri-apps/tauri-action@v0
        env:
          # GitHub token for creating the release
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS signing + notarization
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_PROVIDER_SHORT_NAME: ${{ secrets.APPLE_PROVIDER_SHORT_NAME }}
          # Windows Authenticode signing
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          # Tauri auto-updater signing (signs latest.json so the updater
          # plugin can verify against the pubkey baked into tauri.conf.json)
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Släktforskning ${{ github.ref_name }}'
          releaseBody: |
            See CHANGELOG.md for changes.

            Auto-update note: this release publishes a `latest.json` manifest
            so users running >= 0.250.0 receive the update automatically.
          releaseDraft: true        # maintainer reviews + publishes manually
          prerelease: ${{ contains(github.ref_name, '-tauri.') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
          args: --target ${{ matrix.target }}

      # Linux AppImage signing isn't covered by tauri-action — sign the
      # AppImage out of band with GPG. Only runs when the GPG secret is set
      # (so the workflow doesn't fail for forks without GPG infrastructure).
      - name: Sign Linux AppImage with GPG
        if: runner.os == 'Linux' && env.HAVE_LINUX_GPG_KEY == 'true'
        env:
          HAVE_LINUX_GPG_KEY: ${{ secrets.LINUX_GPG_PRIVATE_KEY != '' }}
          LINUX_GPG_PRIVATE_KEY: ${{ secrets.LINUX_GPG_PRIVATE_KEY }}
          LINUX_GPG_PASSPHRASE: ${{ secrets.LINUX_GPG_PASSPHRASE }}
          LINUX_GPG_KEY_ID: ${{ secrets.LINUX_GPG_KEY_ID }}
          MATRIX_TARGET: ${{ matrix.target }}
        run: |
          echo "$LINUX_GPG_PRIVATE_KEY" | gpg --batch --import
          for f in "src-tauri/target/${MATRIX_TARGET}/release/bundle/appimage/"*.AppImage; do
            gpg --batch --yes --pinentry-mode loopback --passphrase "$LINUX_GPG_PASSPHRASE" \
                --local-user "$LINUX_GPG_KEY_ID" --detach-sign --armor "$f"
          done
