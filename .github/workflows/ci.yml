# Tauri full-port CI matrix
#
# Builds the Tauri spike on macOS, Windows, and Linux. Catches port
# regressions early. Does NOT sign or notarize — that needs real
# certificates and gets wired in Phase 4 of the port plan
# (docs/plans/2026-05-10-tauri-full-port.md).
#
# Triggers on the tauri-full-port branch and on PRs into it. Doesn't
# run for the rest of the project to keep main's CI fast during the
# port. Once the port lands, this workflow either replaces ci.yml's
# package step or merges into it.
#
# Note: every `run:` step uses only static literals; no untrusted GitHub
# event payload is interpolated into shell, so command-injection guards
# from the hook reminder don't apply.

name: Tauri CI

on:
  pull_request:
    branches: [tauri-full-port, main]
  push:
    branches: [tauri-full-port]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  tauri-build:
    strategy:
      fail-fast: false
      matrix:
        # macos-latest = Apple Silicon (arm64). macos-13 = Intel.
        # Test arm64 only for now; Intel build path adds in Phase 7
        # if we still ship Intel macOS binaries at release time.
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            tauri-spike/src-tauri/target/
          key: ${{ runner.os }}-cargo-tauri-spike-${{ hashFiles('tauri-spike/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-tauri-spike-

      # Linux needs WebKit + GTK system deps for Tauri to compile
      # against. macOS WKWebView and Windows WebView2 are OS-bundled.
      - name: Install Linux Tauri prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev \
            build-essential curl wget file libxdo-dev \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev

      # Root npm ci pulls in Vue/Vite/etc.; spike has its own
      # subdirectory deps that npm ci handles.
      - run: npm ci
      - run: 
      # Build the Tauri spike, all default bundles. macOS = .app + .dmg.
      # Windows = .msi + .exe (NSIS). Linux = .deb + .rpm + .AppImage.
      # No signing yet (Phase 4 work).
      - run: npm run build

      # Surface the bundle paths so a human (or a downstream signing
      # job) can grab them.
      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: tauri-spike-${{ matrix.os }}
          path: |
            tauri-spike/src-tauri/target/release/bundle/**/*
          if-no-files-found: error
          retention-days: 7
