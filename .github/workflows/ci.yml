name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Only one CI run per branch / PR at a time. Rapid pushes cancel the previous
# in-flight run — we only care about the latest state.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run audit
      - run: npm test

  # Tier 1 e2e — the 4-project Playwright suite (boot / crud / website-export
  # / duplicates) that gates every PR. Runs against the packaged Tauri binary
  # built by `npm run build:e2e` (which is `tauri build --no-bundle`). Tier 2
  # (the broader panel/CTA suite added by the e2e-expansion plan) stays out
  # of PR CI until the repo goes public OSS — at that point a nightly
  # workflow picks it up. See docs/plans/2026-05-13-e2e-expansion.md.
  #
  # Headless: SLAKTFORSKNING_HEADLESS=1 is set in tests/e2e/fixture.ts (not
  # here) — the env var is honoured by src-tauri/src/lib.rs::setup() to
  # build the main window off-screen and (on macOS) demote the app to
  # Accessory activation policy. On Linux CI we additionally wrap the run in
  # `xvfb-run -a` so the GTK WebView has a virtual display to render into.
  e2e:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Install Linux deps for Tauri + Xvfb
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev libpipewire-0.3-dev libgbm-dev xvfb
      - run: npm ci
      - name: Run e2e (Tier 1, headless via Xvfb + SLAKTFORSKNING_HEADLESS)
        run: xvfb-run -a npm run test:e2e
  # Bundle smoke on every OS — runs on PRs only.
  # On push to main, the Release workflow produces the same artifacts (and
  # publishes them), so running the matrix again here is duplicate work.
  build:
    needs: test
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + target
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-cargo-slaktforskning-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-slaktforskning-

      # Linux needs WebKit + GTK system deps for Tauri to compile
      # against. macOS WKWebView and Windows WebView2 are OS-bundled.
      - name: Install Linux Tauri prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev \
            build-essential curl wget file libxdo-dev \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            libpipewire-0.3-dev libgbm-dev libfuse2t64

      - run: npm ci
      # Build the Tauri bundle. macOS = .app + .dmg.
      # Windows = .msi + .exe (NSIS). Linux = .deb + .rpm + .AppImage.
      # No signing here — that's the release workflow.
      # APPIMAGE_EXTRACT_AND_RUN: linuxdeploy and its plugins are themselves AppImages;
      # on ubuntu-24.04 (ubuntu-latest) libfuse2 is gone, so AppImages can't FUSE-mount.
      # This env makes them extract+run instead of mount.
      - run: npm run build
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1

      # Surface the bundle paths so a human (or a downstream signing
      # job) can grab them.
      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: slaktforskning-${{ matrix.os }}
          path: |
            src-tauri/target/release/bundle/**/*
          if-no-files-found: error
          retention-days: 7
