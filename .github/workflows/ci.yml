# Canonical CI for slaktforskning.
#
# Runs on every push to main + every PR into main. The `unit` job runs
# lint + Vitest on Linux only (host-OS-agnostic; duplicating on every
# matrix leg wastes CI time). The `build` job matrix-builds the Tauri
# bundle on macOS / Windows / Linux to catch port + regression issues
# (e.g. the inlined-gazetteer OOM that bit `npm run build` locally —
# CI running the same build would have caught it on the first push).
# Signing + notarization live in the release workflow, gated on tags.
#
# Note: every `run:` step uses only static literals; no untrusted GitHub
# event payload is interpolated into shell.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test

  build:
    needs: unit
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-cargo-slaktforskning-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-slaktforskning-

      # Linux needs WebKit + GTK system deps for Tauri to compile
      # against. macOS WKWebView and Windows WebView2 are OS-bundled.
      - name: Install Linux Tauri prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev \
            build-essential curl wget file libxdo-dev \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - run: npm ci
      # Build the Tauri bundle. macOS = .app + .dmg.
      # Windows = .msi + .exe (NSIS). Linux = .deb + .rpm + .AppImage.
      # No signing here — that's the release workflow.
      - run: npm run build

      # Surface the bundle paths so a human (or a downstream signing
      # job) can grab them.
      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: slaktforskning-${{ matrix.os }}
          path: |
            src-tauri/target/release/bundle/**/*
          if-no-files-found: error
          retention-days: 7
