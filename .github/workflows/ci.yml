name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint-and-test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps
      - name: Start Xvfb
        run: |
          Xvfb :99 -screen 0 1280x1024x24 &
          echo "DISPLAY=:99" >> $GITHUB_ENV
      # Dependency bumps: smoke only (MCP + app launch). Fast and sufficient.
      - name: E2E (smoke — dep bump)
        if: github.actor == 'dependabot[bot]'
        run: npx playwright test --project=smoke
      # Code changes: full suite, capped at 2 workers so CI doesn't OOM.
      - name: E2E (full — code change)
        if: github.actor != 'dependabot[bot]'
        run: npx playwright test --workers=2
