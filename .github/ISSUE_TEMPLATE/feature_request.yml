name: Feature Request
description: Suggest a feature for Släktforskning
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve? What are you trying to do?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: How do you think this should work?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any other approaches you have considered?
  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Screenshots, mockups, references to other apps.
