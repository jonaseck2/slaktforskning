version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    ignore:
      # vite 5→8 is a rolldown-backed rewrite; major jumps require simultaneous updates
      # to @vitejs/plugin-vue and the three vite.*.config.ts files. Batch manually.
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]

      # @vitejs/plugin-vue major must stay in lockstep with vite major.
      # Block independent bumps here; update together with vite above.
      - dependency-name: "@vitejs/plugin-vue"
        update-types: ["version-update:semver-major"]

      # eslint 9+ uses flat config (eslint.config.js) — a breaking format change.
      # @typescript-eslint/* must stay in lockstep with eslint major.
      # Batch all three together when ready to migrate.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@typescript-eslint/eslint-plugin"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@typescript-eslint/parser"
        update-types: ["version-update:semver-major"]

      # TypeScript 5→6 has breaking changes; upgrade needs dedicated testing.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

      # uuid 14 may have breaking API changes; review separately.
      - dependency-name: "uuid"
        update-types: ["version-update:semver-major"]

    groups:
      tauri:
        patterns:
          - "@tauri-apps/*"
      testing:
        patterns:
          - "vitest*"
          - "@vitest/*"
          - "playwright*"
          - "@playwright/*"
      vite:
        patterns:
          - "vite*"
          - "@vitejs/*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    ignore:
      # v3 has breaking changes; review release notes before upgrading.
      - dependency-name: "softprops/action-gh-release"
        update-types: ["version-update:semver-major"]
