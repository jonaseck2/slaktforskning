version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    ignore:
      # @electron-forge/plugin-fuses@7.x requires @electron/fuses@^1.x.
      # v2 is a breaking API change — re-enable when forge bumps plugin-fuses to support v2.
      - dependency-name: "@electron/fuses"
        update-types: ["version-update:semver-major"]

      # vite 5→8 is a rolldown-backed rewrite; major jumps require simultaneous updates
      # to @vitejs/plugin-vue and the three vite.*.config.ts files. Batch manually.
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]

      # @vitejs/plugin-vue major must stay in lockstep with vite major.
      # Block independent bumps here; update together with vite above.
      - dependency-name: "@vitejs/plugin-vue"
        update-types: ["version-update:semver-major"]

      # NOTE (OS-level, no npm ignore applicable):
      # @electron-forge/maker-rpm@7.x generates RPM spec files incompatible with
      # rpmbuild 4.20 shipped in ubuntu-24.04 / ubuntu-latest as of 2025-04.
      # The Linux release job uses ubuntu-22.04 (rpmbuild 4.18) as a workaround.
      # Re-evaluate when electron-forge or electron-installer-redhat publishes a fix.

    groups:
      electron:
        patterns:
          - "electron*"
      testing:
        patterns:
          - "vitest*"
          - "@vitest/*"
          - "playwright*"
          - "@playwright/*"
      vite:
        patterns:
          - "vite*"
          - "@vitejs/*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
