[package]
name = "slaktforskning"
version = "0.259.2"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "slaktforskning_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
# Auto-updater plugin: checks GitHub Releases for `latest.json`, verifies the
# signature against tauri.conf.json plugins.updater.pubkey, downloads + applies
# the update with the user's confirmation. The renderer drives the prompt via
# `api.app.checkForUpdates()` (see src/renderer/tauri-window-api.ts).
tauri-plugin-updater = "2"
# Shell plugin: needed to spawn the bundled MCP sidecar (mcp-server-<triple>)
# via the Tauri 2 sidecar API. The Electron build's MCP server runs via
# `npx tsx`; in packaged Tauri builds we ship a self-contained Node binary
# built by scripts/build-mcp-sidecar.mjs.
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.33", features = ["bundled"] }
parking_lot = "0.12"
once_cell = "1"
tokio = { version = "1", features = ["process", "io-util", "rt", "rt-multi-thread", "macros", "time", "sync", "net"] }
axum = "0.7"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
xcap = "0.9"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
walkdir = "2"
# Specta + tauri-specta: codegen TypeScript bindings from #[tauri::command]
# functions. Replaces the hand-rolled src/shared/channels/ registry. See
# docs/plans/2026-05-14-specta-migration.md.
specta = "=2.0.0-rc.25"
specta-typescript = "=0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }

