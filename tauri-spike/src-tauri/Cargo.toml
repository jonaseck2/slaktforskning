[package]
name = "tauri-spike"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_spike_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# walfix lives in examples/ so it isn't picked up by cargo's default
# build (and consequently isn't grabbed by Tauri's bundler in place of
# the real app binary). Build it manually when needed:
#   cargo build --release --example walfix
# Output: target/release/examples/walfix
# See `.claude/skills/sqlite-wal/` for what walfix does and when to run it.

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.33", features = ["bundled"] }
parking_lot = "0.12"
once_cell = "1"
tokio = { version = "1", features = ["process", "io-util", "rt", "macros", "time"] }

